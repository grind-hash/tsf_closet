[project]
name = "dress-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.108.1",
    "pillow>=11.3.0",
    "python-dotenv>=1.1.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.2.1",
    "aiosqlite>=0.21.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "novelai-sdk>=0.4.3",
    "gunicorn>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.2",
]

[tool.uv]
package = false
exclude-newer = "2 week"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88
# Alembic が自動生成する migration は対象外にする（テンプレートが Union[...] 形式を出すため）
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # 行長は formatter に任せる（プロンプト文字列など 88 桁を超える文字列が多い）
    "E501",
    # if/else を三項演算子や dict 参照へ書き換える指摘は可読性を下げることがあるため強制しない
    "SIM108",
    "SIM116",
    # PEP 695 のジェネリック構文への移行は強制しない
    "UP046",
    "UP047",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI の Depends() / File() などを引数の既定値で呼ぶのは慣用なので許可する
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Cookie",
]
