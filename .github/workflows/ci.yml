name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # setup-uv は v10 のようなメジャータグを提供していないため完全なバージョンで指定する
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          working-directory: backend
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Import sanity
        run: uv run python -c "from gateway.routes import game_router; print('ok')"

      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (biome / tsc / vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Vitest
        run: npm run test
